name: Sestavit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Sestavit
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Pripravit APK
        run: cp app/build/outputs/apk/debug/app-debug.apk prehravac.apk

      - name: Zverejnit ke stazeni
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Přehrávač 0.1.${{ github.run_number }}
          body: "Stáhni **prehravac.apk** níže a nainstaluj."
          files: prehravac.apk
          make_latest: true
